version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    restart: always
    ports:
      - ${POSTGRES_PORT}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -h ${POSTGRES_HOST}"]
      interval: 3s
      timeout: 10s
      retries: 5
      start_period: 5s
  redis:
    image: redis:8.6.3-alpine
    env_file: .env
    restart: always
    ports:
      - ${REDIS_PORT}
    command: redis-server --save "" --appendonly no --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli", "--user", "${REDIS_USER}", "--pass", "${REDIS_PASSWORD}", "-h", "${REDIS_HOST}", "-p", "${REDIS_PORT}", "-n", "${REDIS_DB}", "ping"]    
      interval: 3s
      timeout: 10s
      retries: 5
      start_period: 5s

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"